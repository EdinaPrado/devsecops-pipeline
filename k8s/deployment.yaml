# VULNERÁVEL DE PROPÓSITO: privilegiado, root, sem limites, tag latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
