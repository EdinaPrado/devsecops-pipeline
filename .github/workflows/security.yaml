name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Checkov (versão fixa)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --no-cache-dir checkov==3.2.508

      - name: Scan do Terraform
        run: |
          . .venv/bin/activate
          checkov -d terraform --framework terraform --compact --quiet

      - name: Scan do Kubernetes
        if: always()
        run: |
          . .venv/bin/activate
          checkov -d k8s --framework kubernetes --compact --quiet
